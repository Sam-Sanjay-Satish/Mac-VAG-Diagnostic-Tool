# macvagdiag desktop app. Command-line flags override these, e.g. --server.port=8090 or --macvagdiag.port=...
spring.application.name=macvagdiag
spring.main.banner-mode=off

# Loopback only. LoopbackOnlyConfiguration refuses to start on a non-loopback address.
server.address=127.0.0.1
server.port=8080

# Error bodies never carry stack traces or exception text from Spring itself.
server.error.include-stacktrace=never
server.error.include-message=never

# --- macvagdiag (see MacVagDiagProperties) ---
# Demo car instead of the CANable (same as --demo).
macvagdiag.demo=false
# CANable serial port, e.g. /dev/cu.usbmodem14101. Empty: auto-detect by USB ID.
macvagdiag.port=
# Audit log. Empty: ~/Library/Application Support/macvagdiag/audit.jsonl on macOS.
macvagdiag.audit-log=
# Diagnostic CAN speed in bit/s. 0: 500000 (UNCONFIRMED until the sniffing session).
macvagdiag.bits-per-second=0
# Mask the VIN in MCP tool results. AI clients can't change this; only this setting can.
macvagdiag.mcp-mask-vin=true
